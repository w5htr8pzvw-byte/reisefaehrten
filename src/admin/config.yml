backend:
  name: github
  repo: w5htr8pzvw-byte/reisefaehrten
  branch: main

media_folder: "src/images/werke"
public_folder: "/images/werke"

collections:

  # --- Werke: Deutsch --------------------------------------------------
  - name: "werke_de"
    label: "Werke (Deutsch)"
    label_singular: "Werk"
    folder: "src/werke"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Kurzbeschreibung (für Suchmaschinen)", name: "description", widget: "string", required: false}
      - {label: "Ort", name: "place", widget: "string"}
      - {label: "Jahr", name: "year", widget: "string", required: false}
      - {label: "Papier", name: "paper", widget: "string", required: false}
      - {label: "Formate", name: "sizes", widget: "string", required: false}
      - {label: "Preis ab (nur Zahl, ohne €)", name: "priceFrom", widget: "string", required: false}
      - {label: "Bild", name: "image", widget: "image"}
      - {label: "Alt-Text (Bildbeschreibung für Screenreader/SEO)", name: "imageAlt", widget: "string"}
      - label: "Kategorie"
        name: "category"
        widget: "select"
        options: ["reise", "natur", "tiere", "staedte"]
      - {label: "Breites Format in der Galerie?", name: "wide", widget: "boolean", default: false}
      - {label: "Hochformat in der Galerie?", name: "tall", widget: "boolean", default: false}
      - {label: "Reihenfolge (höhere Zahl erscheint zuerst)", name: "order", widget: "number", default: 1}
      - {label: "Geschichte zum Bild", name: "body", widget: "text"}
      - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/werk.njk"}

  # --- Werke: Englisch ---------------------------------------------------
  - name: "werke_en"
    label: "Works (English)"
    label_singular: "Work"
    folder: "src/en/artwork"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Short description (for search engines)", name: "description", widget: "string", required: false}
      - {label: "Place", name: "place", widget: "string"}
      - {label: "Year", name: "year", widget: "string", required: false}
      - {label: "Paper", name: "paper", widget: "string", required: false}
      - {label: "Sizes", name: "sizes", widget: "string", required: false}
      - {label: "Price from (number only, no €)", name: "priceFrom", widget: "string", required: false}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Alt text (image description for screen readers/SEO)", name: "imageAlt", widget: "string"}
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["travel", "nature", "wildlife", "cities"]
      - {label: "Wide format in the gallery?", name: "wide", widget: "boolean", default: false}
      - {label: "Tall format in the gallery?", name: "tall", widget: "boolean", default: false}
      - {label: "Order (higher number shows first)", name: "order", widget: "number", default: 1}
      - {label: "Story behind the image", name: "body", widget: "text"}
      - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/werk-en.njk"}

  # --- Seiteninhalte: Deutsch --------------------------------------------
  - name: "seiten_de"
    label: "Seiteninhalte (Deutsch)"
    files:

      - name: "start"
        label: "Startseite"
        file: "src/index.njk"
        fields:
          - {label: "Seitentitel (Browser-Tab)", name: "title", widget: "string"}
          - {label: "Meta-Beschreibung (SEO)", name: "description", widget: "string", required: false}
          - {label: "Hero-Bild", name: "heroImage", widget: "image"}
          - {label: "Alt-Text Hero-Bild", name: "heroImageAlt", widget: "string"}
          - {label: "Überschrift im Hero-Bild", name: "heroTitle", widget: "string"}
          - {label: "Text im Hero-Bild", name: "heroText", widget: "text"}
          - {label: "Überschrift Einführung", name: "introTitle", widget: "string"}
          - {label: "Text Einführung", name: "introText", widget: "text"}
          - {label: "Porträtbild ('Hinter der Kamera')", name: "portraitImage", widget: "image"}
          - {label: "Alt-Text Porträtbild", name: "portraitImageAlt", widget: "string"}
          - {label: "Text bei 'Hinter der Kamera'", name: "aboutTeaserText", widget: "text"}
          - {label: "Überschrift am Seitenende", name: "closingTitle", widget: "string"}
          - {label: "Text am Seitenende", name: "closingText", widget: "text"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.njk"}
          - {label: "Sprache", name: "lang", widget: "hidden", default: "de"}
          - {label: "Aktiver Nav-Punkt", name: "navActive", widget: "hidden", default: "start"}
          - {label: "Link zur Sprachumschaltung", name: "langSwitchUrl", widget: "hidden", default: "/en/"}

      - name: "ueber_mich"
        label: "Über mich"
        file: "src/ueber-mich.njk"
        fields:
          - {label: "Seitentitel (Browser-Tab)", name: "title", widget: "string"}
          - {label: "Meta-Beschreibung (SEO)", name: "description", widget: "string", required: false}
          - {label: "Einleitung, Absatz 1", name: "introText1", widget: "text"}
          - {label: "Einleitung, Absatz 2", name: "introText2", widget: "text"}
          - {label: "Überschrift 'Vom Auslöser zum Druck'", name: "processTitle", widget: "string"}
          - {label: "Text dazu (1)", name: "processText", widget: "text"}
          - {label: "Text dazu (2)", name: "processText2", widget: "text"}
          - {label: "Überschrift am Seitenende", name: "closingTitle", widget: "string"}
          - {label: "Text am Seitenende", name: "closingText", widget: "text"}
          - {label: "Porträtbild", name: "portraitImage", widget: "image"}
          - {label: "Alt-Text Porträtbild", name: "portraitImageAlt", widget: "string"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.njk"}
          - {label: "Sprache", name: "lang", widget: "hidden", default: "de"}
          - {label: "Aktiver Nav-Punkt", name: "navActive", widget: "hidden", default: "ueber-mich"}
          - {label: "Link zur Sprachumschaltung", name: "langSwitchUrl", widget: "hidden", default: "/en/about/"}

      - name: "bestellung"
        label: "Bestellung & FAQ"
        file: "src/bestellung.njk"
        fields:
          - {label: "Seitentitel (Browser-Tab)", name: "title", widget: "string"}
          - {label: "Meta-Beschreibung (SEO)", name: "description", widget: "string", required: false}
          - {label: "Einleitungstext", name: "introText", widget: "text"}
          - label: "Bestellschritte"
            name: "steps"
            widget: "list"
            hint: "Text kann HTML-Links enthalten (z. B. <a href=\"/galerie/\">Galerie</a>) — beim Bearbeiten vorsichtig sein."
            fields:
              - {label: "Titel", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
          - label: "Häufige Fragen"
            name: "faq"
            widget: "list"
            fields:
              - {label: "Frage", name: "question", widget: "string"}
              - {label: "Antwort", name: "answer", widget: "text"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.njk"}
          - {label: "Sprache", name: "lang", widget: "hidden", default: "de"}
          - {label: "Aktiver Nav-Punkt", name: "navActive", widget: "hidden", default: "bestellung"}
          - {label: "Link zur Sprachumschaltung", name: "langSwitchUrl", widget: "hidden", default: "/en/ordering/"}

      - name: "kontakt"
        label: "Kontakt"
        file: "src/kontakt.njk"
        fields:
          - {label: "Seitentitel (Browser-Tab)", name: "title", widget: "string"}
          - {label: "Meta-Beschreibung (SEO)", name: "description", widget: "string", required: false}
          - {label: "Einleitungstext", name: "introText", widget: "text"}
          - {label: "Kontakt-E-Mail-Adresse", name: "contactEmail", widget: "string"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.njk"}
          - {label: "Sprache", name: "lang", widget: "hidden", default: "de"}
          - {label: "Aktiver Nav-Punkt", name: "navActive", widget: "hidden", default: "kontakt"}
          - {label: "Link zur Sprachumschaltung", name: "langSwitchUrl", widget: "hidden", default: "/en/contact/"}

      - name: "impressum"
        label: "Impressum"
        file: "src/impressum.njk"
        fields:
          - {label: "Vor- und Nachname", name: "fullName", widget: "string"}
          - {label: "Straße und Hausnummer", name: "street", widget: "string"}
          - {label: "PLZ und Ort", name: "zipCity", widget: "string"}
          - {label: "Land", name: "country", widget: "string"}
          - {label: "Telefon (optional)", name: "phone", widget: "string", required: false}
          - {label: "E-Mail", name: "email", widget: "string"}
          - {label: "USt-IdNr. (falls vorhanden)", name: "ustId", widget: "string", required: false}
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.njk"}
          - {label: "Sprache", name: "lang", widget: "hidden", default: "de"}
          - {label: "Aktiver Nav-Punkt", name: "navActive", widget: "hidden", default: "kontakt"}
          - {label: "Link zur Sprachumschaltung", name: "langSwitchUrl", widget: "hidden", default: "/en/imprint/"}

      - name: "datenschutz"
        label: "Datenschutz"
        file: "src/datenschutz.njk"
        fields:
          - {label: "Vor- und Nachname", name: "fullName", widget: "string"}
          - {label: "Anschrift", name: "address", widget: "string"}
          - {label: "E-Mail", name: "email", widget: "string"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.njk"}
          - {label: "Sprache", name: "lang", widget: "hidden", default: "de"}
          - {label: "Aktiver Nav-Punkt", name: "navActive", widget: "hidden", default: "kontakt"}
          - {label: "Link zur Sprachumschaltung", name: "langSwitchUrl", widget: "hidden", default: "/en/privacy/"}

  # --- Page content: English ---------------------------------------------
  - name: "seiten_en"
    label: "Page content (English)"
    files:

      - name: "home"
        label: "Homepage"
        file: "src/en/index.njk"
        fields:
          - {label: "Page title (browser tab)", name: "title", widget: "string"}
          - {label: "Meta description (SEO)", name: "description", widget: "string", required: false}
          - {label: "Hero image", name: "heroImage", widget: "image"}
          - {label: "Hero image alt text", name: "heroImageAlt", widget: "string"}
          - {label: "Hero headline", name: "heroTitle", widget: "string"}
          - {label: "Hero text", name: "heroText", widget: "text"}
          - {label: "Intro headline", name: "introTitle", widget: "string"}
          - {label: "Intro text", name: "introText", widget: "text"}
          - {label: "Portrait image ('Behind the camera')", name: "portraitImage", widget: "image"}
          - {label: "Portrait image alt text", name: "portraitImageAlt", widget: "string"}
          - {label: "'Behind the camera' text", name: "aboutTeaserText", widget: "text"}
          - {label: "Closing headline", name: "closingTitle", widget: "string"}
          - {label: "Closing text", name: "closingText", widget: "text"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.njk"}
          - {label: "Language", name: "lang", widget: "hidden", default: "en"}
          - {label: "Active nav item", name: "navActive", widget: "hidden", default: "start"}
          - {label: "Language switch link", name: "langSwitchUrl", widget: "hidden", default: "/"}

      - name: "about"
        label: "About"
        file: "src/en/about.njk"
        fields:
          - {label: "Page title (browser tab)", name: "title", widget: "string"}
          - {label: "Meta description (SEO)", name: "description", widget: "string", required: false}
          - {label: "Intro, paragraph 1", name: "introText1", widget: "text"}
          - {label: "Intro, paragraph 2", name: "introText2", widget: "text"}
          - {label: "'From shutter to print' headline", name: "processTitle", widget: "string"}
          - {label: "Text (1)", name: "processText", widget: "text"}
          - {label: "Text (2)", name: "processText2", widget: "text"}
          - {label: "Closing headline", name: "closingTitle", widget: "string"}
          - {label: "Closing text", name: "closingText", widget: "text"}
          - {label: "Portrait image", name: "portraitImage", widget: "image"}
          - {label: "Portrait image alt text", name: "portraitImageAlt", widget: "string"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.njk"}
          - {label: "Language", name: "lang", widget: "hidden", default: "en"}
          - {label: "Active nav item", name: "navActive", widget: "hidden", default: "ueber-mich"}
          - {label: "Language switch link", name: "langSwitchUrl", widget: "hidden", default: "/ueber-mich/"}

      - name: "ordering"
        label: "Ordering & FAQ"
        file: "src/en/ordering.njk"
        fields:
          - {label: "Page title (browser tab)", name: "title", widget: "string"}
          - {label: "Meta description (SEO)", name: "description", widget: "string", required: false}
          - {label: "Intro text", name: "introText", widget: "text"}
          - label: "Ordering steps"
            name: "steps"
            widget: "list"
            hint: 'Text can contain HTML links (e.g. <a href="/en/gallery/">gallery</a>) — edit carefully.'
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
          - label: "Frequently asked questions"
            name: "faq"
            widget: "list"
            fields:
              - {label: "Question", name: "question", widget: "string"}
              - {label: "Answer", name: "answer", widget: "text"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.njk"}
          - {label: "Language", name: "lang", widget: "hidden", default: "en"}
          - {label: "Active nav item", name: "navActive", widget: "hidden", default: "bestellung"}
          - {label: "Language switch link", name: "langSwitchUrl", widget: "hidden", default: "/bestellung/"}

      - name: "contact"
        label: "Contact"
        file: "src/en/contact.njk"
        fields:
          - {label: "Page title (browser tab)", name: "title", widget: "string"}
          - {label: "Meta description (SEO)", name: "description", widget: "string", required: false}
          - {label: "Intro text", name: "introText", widget: "text"}
          - {label: "Contact email address", name: "contactEmail", widget: "string"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.njk"}
          - {label: "Language", name: "lang", widget: "hidden", default: "en"}
          - {label: "Active nav item", name: "navActive", widget: "hidden", default: "kontakt"}
          - {label: "Language switch link", name: "langSwitchUrl", widget: "hidden", default: "/kontakt/"}
