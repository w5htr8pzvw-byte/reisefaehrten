<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Privates Album — Reisefährten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!--
  VORLAGE FÜR EIN PRIVATES ALBUM — siehe privat/README.md für die
  vollständige Anleitung. Kurzfassung:
  1. Diese Datei kopieren und unter einem nicht erratbaren Namen speichern,
     z. B. privat-italien-sommer-k3x9p2.html (nicht "album1.html" o. ä.)
  2. Mit privat/code-hash-generator.html einen neuen Zugriffscode in einen
     Hash umwandeln und unten bei "expectedHash" eintragen
  3. Titel, Intro und Bilder im ALBUM_CONFIG unten anpassen
  4. Diese Seite NIRGENDS verlinken (nicht in der Navigation, nicht in der
     Sitemap) — nur den fertigen Link + Code direkt an die gewünschte
     Person weitergeben
-->

<header class="site-header">
  <div class="container">
    <a href="../index.html" class="wordmark">Reisefährten</a>
  </div>
</header>

<main>
  <section class="access-gate">
    <div class="container" style="max-width: 26rem;">
      <h1 style="font-size: clamp(1.8rem, 4vw, 2.4rem);">Privates Album</h1>
      <p>Dieser Bereich ist nicht öffentlich gelistet. Bitte den Zugriffscode eingeben, den du erhalten hast.</p>
      <form id="gate-form">
        <div>
          <label for="code">Zugriffscode</label>
          <input type="password" id="code" autocomplete="off" required>
        </div>
        <button type="submit" class="btn btn--solid">Freischalten</button>
        <p id="gate-error" role="alert" style="display:none; color: var(--color-accent); margin-top: var(--space-2);">Der Code ist leider nicht korrekt.</p>
      </form>
    </div>
  </section>

  <section class="section--tight">
    <div class="container" id="album-content" hidden>
      <!-- wird nach erfolgreicher Code-Eingabe per JavaScript befüllt -->
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p style="max-width:none;">Reisefährten — privater Bereich, nicht öffentlich verlinkt.</p>
  </div>
</footer>

<script>
  window.ALBUM_CONFIG = {
    title: "[Titel des Albums, z. B. „Italien, Sommer 2026“]",
    intro: "[Optional: kurzer Begrüßungstext für die Empfänger:innen dieses Links]",
    // Demo-Code für diese Vorlage: sonnenuntergang26
    // Für ein neues Album mit privat/code-hash-generator.html einen
    // eigenen Code in einen Hash umwandeln und hier einsetzen.
    expectedHash: "d9b5f58f0b38198293971865a14074f59eba3e82595becbe86ae51f1d9f1f65e",
    images: [
      { src: "images/privat-foto-1.svg", alt: "[Platzhalter: Foto 1]", caption: "[Bildunterschrift, z. B. Ort/Tag]", wide: true },
      { src: "images/privat-foto-2.svg", alt: "[Platzhalter: Foto 2]", caption: "[Bildunterschrift]" },
      { src: "images/privat-foto-3.svg", alt: "[Platzhalter: Foto 3]", caption: "[Bildunterschrift]", tall: true },
      { src: "images/privat-foto-4.svg", alt: "[Platzhalter: Foto 4]", caption: "[Bildunterschrift]" }
    ]
  };
</script>
<script src="js/gate.js"></script>
</body>
</html>
